name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No job here needs write access; checkout only needs `contents: read`.
# Set explicitly so the workflow does not inherit repository defaults, which
# can be changed in the UI without touching this file. Unlisted permissions
# become `none`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Host tests over the feature powerset.
  #
  # The rp235x chip features are excluded here, not overlooked: embassy-rp's
  # rp235x path uses `cortex_m::register::msplim`, which only exists on ARMv8-M,
  # so those features cannot compile for the host at all. They are covered by the
  # `check` job below. rp2040 does build for the host, and since the logic under
  # test is chip-independent arithmetic, it gives full coverage of it.
  test:
    name: test (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - name: cargo hack test --feature-powerset
        run: |
          cargo hack test --feature-powerset --depth 2 \
            --exclude-features rp235xa,rp235xb,_rp

  # Every chip feature against its real target. This is the only thing guarding
  # rp235xb, which no maintainer currently has hardware for.
  check:
    name: check ${{ matrix.chip }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: rp2040
            target: thumbv6m-none-eabi
            exclude: rp235xa,rp235xb
          - chip: rp235xa
            target: thumbv8m.main-none-eabihf
            exclude: rp2040,rp235xb
          - chip: rp235xb
            target: thumbv8m.main-none-eabihf
            exclude: rp2040,rp235xa
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      # A chip may not appear in both --features and --exclude-features, so each
      # row excludes only the other chips. `std` is excluded because these are
      # bare-metal targets.
      - name: cargo hack check
        run: |
          cargo hack check --target ${{ matrix.target }} \
            --each-feature --features ${{ matrix.chip }} \
            --exclude-features ${{ matrix.exclude }},_rp,std

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv8m.main-none-eabihf
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `examples/` is a nested workspace, so the `--all` above never descends
      # into it. Check it explicitly or it drifts unnoticed.
      - run: cargo fmt --manifest-path examples/Cargo.toml --all --check
      - name: clippy (host powerset)
        run: |
          cargo hack clippy --feature-powerset --depth 2 \
            --exclude-features rp235xa,rp235xb,_rp \
            -- -W clippy::pedantic -W clippy::nursery
      - name: clippy (rp235x)
        run: |
          cargo clippy --target thumbv8m.main-none-eabihf --features rp235xb \
            -- -W clippy::pedantic -W clippy::nursery

  examples:
    name: examples ${{ matrix.chip }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - chip: rp2040
            target: thumbv6m-none-eabi
          - chip: rp235xa
            target: thumbv8m.main-none-eabihf
          - chip: rp235xb
            target: thumbv8m.main-none-eabihf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples
      # examples/.cargo/config.toml pins a default target, so pass --target to override.
      - name: cargo build
        run: |
          cargo build --manifest-path examples/Cargo.toml \
            --no-default-features --features ${{ matrix.chip }} \
            --target ${{ matrix.target }}
      # The build above only gates rustc warnings, via RUSTFLAGS. Clippy's own
      # lints went unchecked here until 0.5.0, so the examples had drifted.
      - name: cargo clippy
        run: |
          cargo clippy --manifest-path examples/Cargo.toml --bins \
            --no-default-features --features ${{ matrix.chip }} \
            --target ${{ matrix.target }}
